name: absensi_alma
description: "Aplikasi Absensi Karyawan PT Alma "
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.0.0
  reactive_button: ^0.0.9
  cupertino_icons:
  flutter_bloc: ^8.1.5
  dio: ^5.4.3+1
  get_it: ^7.6.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  equatable: ^2.0.5
  flutter_secure_storage: ^9.2.2
  bloc: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Light.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter_18pt-Italic.ttf
          style: italic
